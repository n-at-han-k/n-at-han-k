# Every Ruby gem under n-at-han-k is converged onto the kettle-jem template,
# and stays converged. Plain Actions, not gh-aw — the work is scripted and
# there is no judgement in it.
#
# The same shape as ruby-gtk-project's Converge port gems: the repositories
# come from a registry, and the result is a pull request per repo rather than
# a push, so that a template change to forty of my own projects is reviewed
# once per project before it lands.
#
# The registry is .github/repos.yml — the same file README.md is rendered
# from, so the profile page and the converge set are one list and cannot
# drift. It replaced API discovery, which was scoped to a single owner.
#
# A repo is in scope when it is listed under a `converge: kettle-jem` section,
# is not marked `converge: false`, is not a fork, not archived, not empty, and
# has a gemspec at its root — kettle-jem hard-fails without one. Each repo's
# licence comes from GitHub, never from the template: Apache-2.0, MIT and
# LGPL-2.1 are all in use here, and config_sync's default is MIT.
#
# The general-intelligence-systems gems are listed and opted out: discovery
# never reached them, so converging them for the first time is its own
# decision rather than a side effect of this change.
name: Converge Ruby gems

on:
  schedule:
    - cron: "41 5 * * 1"  # Mondays
  workflow_dispatch:
    inputs:
      only:
        description: "Converge a single repo (name or owner/name), blank = all"
        required: false
        type: string
      dry_run:
        description: "Converge and report, but open no pull request"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # the failure-issue step

concurrency:
  group: converge-ruby-gems
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: kettle-jem/converge
    steps:
      - uses: actions/checkout@v4

      # kettle-jem requires Ruby >= 4.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install kettle-jem
        run: |
          set -euo pipefail
          # kettle-jem declares `prism >= 1.6.0` but calls
          # Prism::Node#breadth_first_search_all, which only exists in prism
          # >= 1.9.0. Ruby 4.0.x bundles 1.8.1, so the pin is mandatory —
          # without it every run dies with NoMethodError.
          mkdir -p "$RUNNER_TEMP/kj"
          cat > "$RUNNER_TEMP/kj/Gemfile" <<'EOF'
          source "https://rubygems.org"
          gem "prism", "1.9.0"
          gem "kettle-jem", "~> 7.1"
          EOF
          echo "BUNDLE_GEMFILE=$RUNNER_TEMP/kj/Gemfile" >> "$GITHUB_ENV"
          BUNDLE_GEMFILE="$RUNNER_TEMP/kj/Gemfile" bundle install --quiet
          BUNDLE_GEMFILE="$RUNNER_TEMP/kj/Gemfile" bundle exec kettle-jem version

      # The same token as the converge step, so that both see the same set of
      # repositories: the built-in one is scoped to this repository, so a
      # private gem under either owner is invisible to it.
      - name: Find the gems
        env:
          GH_TOKEN: ${{ secrets.KETTLE_JEM_TOKEN || github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail

          # The registry, not the API. `gh repo list` is GraphQL and answers a
          # partially-scoped PAT with per-node errors and a non-zero exit; the
          # REST listing that replaced it could only ever name one owner, and
          # these gems live under two. Reading the file settles both, and ties
          # the converge set to the profile page's own list.
          #
          # Being listed is a statement of intent, not evidence of shape, so
          # every check below still runs.
          ruby -ryaml -e '
            data = YAML.safe_load_file(".github/repos.yml")
            data.fetch("sections").each do |section|
              next unless section["converge"] == "kettle-jem"
              section.fetch("repos").each do |entry|
                next if entry["converge"] == false
                puts entry.fetch("repo")
              end
            end
          ' > "$RUNNER_TEMP/registry.txt"

          echo "declared in .github/repos.yml: $(wc -l < "$RUNNER_TEMP/registry.txt") gems"

          : > "$RUNNER_TEMP/gems.tsv"
          while read -r slug; do
            [ -n "$slug" ] || continue
            owner=${slug%%/*}
            repo=${slug#*/}

            # `only` takes the bare name or the full owner/name.
            if [ -n "$ONLY" ] && [ "$ONLY" != "$slug" ] && [ "$ONLY" != "$repo" ]; then
              continue
            fi

            # One call for the repo's own facts. `gh api` prints the error
            # body to stdout on a non-2xx, so nothing is believed unless the
            # call succeeded and the field parses. An empty repository names a
            # default branch that does not exist yet, and `git clone --branch`
            # on it would be counted as a failure.
            if ! meta=$(gh api "repos/$slug" \
              --jq '[.default_branch // "", .fork, .archived, .size, .license.spdx_id // "-"] | @tsv' 2>/dev/null); then
              echo "::warning::$slug: not readable with this token, skipped"
              continue
            fi
            IFS=$'\t' read -r branch fork archived size license <<< "$meta"

            case "$size" in ''|*[!0-9]*) size=0 ;; esac
            case "$license" in *[!A-Za-z0-9.+-]*|'') license="-" ;; esac

            if [ "$fork" = "true" ]; then
              echo "::notice::$slug: a fork, skipped"; continue
            fi
            if [ "$archived" = "true" ]; then
              echo "::notice::$slug: archived, skipped"; continue
            fi
            if [ -z "$branch" ] || [ "$size" -eq 0 ]; then
              echo "::notice::$slug: empty, skipped"; continue
            fi

            # kettle-jem hard-fails without a gemspec at the root.
            gemspec=$(gh api "repos/$slug/contents" \
              --jq '[.[] | select(.type == "file" and (.name | endswith(".gemspec")))] | length' 2>/dev/null) || gemspec=0
            case "$gemspec" in ''|*[!0-9]*) gemspec=0 ;; esac
            if [ "$gemspec" -eq 0 ]; then
              # Listed under a `converge: kettle-jem` section but not shaped
              # like a gem. That is an error in the registry rather than in
              # the repo, and silence would hide it: discovery would simply
              # never have picked it up.
              echo "::warning::$slug: listed as a gem but has no gemspec at its root"
              continue
            fi

            printf '%s\t%s\t%s\t%s\n' "$owner" "$repo" "$branch" "$license" >> "$RUNNER_TEMP/gems.tsv"
          done < "$RUNNER_TEMP/registry.txt"

          echo "in scope: $(wc -l < "$RUNNER_TEMP/gems.tsv") gems"
          cat "$RUNNER_TEMP/gems.tsv"

      - name: Converge every gem
        env:
          # Falls back to the built-in token, which cannot push to another
          # repository: without the PAT the run converges and reports, and
          # opens nothing.
          GH_TOKEN: ${{ secrets.KETTLE_JEM_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.KETTLE_JEM_TOKEN != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          gh auth setup-git  # git pushes authenticate with the token
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          opened=(); updated=(); unchanged=(); unlicensed=(); converged=(); not_ready=(); failed=()

          while IFS=$'\t' read -r owner repo branch license; do
            slug="$owner/$repo"
            if [ "$license" = "-" ] || [ "$license" = "NOASSERTION" ]; then
              # Not our error, and not something to guess: kettle-jem would
              # write MIT into it.
              unlicensed+=("$slug"); continue
            fi

            tmp=$(mktemp -d)
            if ! git clone --quiet --depth 1 --branch "$branch" "https://github.com/$slug" "$tmp/r"; then
              failed+=("$slug (clone)"); rm -rf "$tmp"; continue
            fi

            # Does it build before anything is touched? A gem that was
            # already failing to build is not evidence against the template,
            # and blaming it on this run would be a lie.
            if ! (cd "$tmp/r" && gem build ./*.gemspec >/dev/null 2>&1); then
              echo "::notice::$slug: gem build was already failing before converging"
              not_ready+=("$slug"); rm -rf "$tmp"; continue
            fi
            rm -f "$tmp/r"/*.gem

            # `|| rc=$?` and not a bare call: the default step shell is
            # `bash -e`, which `set -uo pipefail` does not undo, so a non-zero
            # exit from the script would kill the step before this check.
            rc=0
            bundle exec .github/kettle-jem/converge-repo.sh "$tmp/r" "$slug" "$license" || rc=$?
            # 3 is the repo's own shape, not our error: it needs a change
            # before kettle-jem can run on it at all, and the script has said
            # on the log which one.
            if [ "$rc" = "3" ]; then
              not_ready+=("$slug"); rm -rf "$tmp"; continue
            fi
            if [ "$rc" != "0" ]; then
              failed+=("$slug (converge)"); rm -rf "$tmp"; continue
            fi

            # It built before, so if it does not build now the template did
            # it, and that is ours.
            if ! (cd "$tmp/r" && gem build ./*.gemspec >/dev/null 2>&1); then
              failed+=("$slug (gem build regressed)"); rm -rf "$tmp"; continue
            fi
            rm -f "$tmp/r"/*.gem

            git -C "$tmp/r" add -A
            if git -C "$tmp/r" diff --cached --quiet; then
              unchanged+=("$slug"); rm -rf "$tmp"; continue
            fi

            if [ "$DRY_RUN" = "true" ] || [ "$HAS_PAT" != "true" ]; then
              converged+=("$slug ($(git -C "$tmp/r" diff --cached --name-only | wc -l) files)")
              rm -rf "$tmp"; continue
            fi

            git -C "$tmp/r" checkout -q -b "$BRANCH"
            if ! git -C "$tmp/r" commit -qm "Converge on the kettle-jem gem template" \
               || ! git -C "$tmp/r" push -q --force origin "$BRANCH"; then
              failed+=("$slug (push)"); rm -rf "$tmp"; continue
            fi

            # Force-pushing the branch updates an open pull request in place,
            # so there is one per repo however many times this runs.
            existing=$(gh api "repos/$slug/pulls?head=$owner:$BRANCH&state=open" --jq '.[0].number' 2>/dev/null)
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              updated+=("$slug#$existing")
            elif gh pr create -R "$slug" --base "$branch" --head "$BRANCH" \
                 --title "Converge on the kettle-jem gem template" \
                 --body "$(printf 'Applied by [Converge Ruby gems](%s/%s/actions/runs/%s) in n-at-han-k/n-at-han-k, from the shared config in `.github/kettle-jem/`.\n\nThe licence (`%s`) and the gemspec Ruby floor are pinned from this repo, not derived — kettle-jem defaults to MIT. The repo keeps its own README, CHANGELOG, AGENTS.md, .rubocop.yml, flake.nix and `.github/workflows/`; see the config for why each one is `keep_destination`.\n\n`gem build` was run against the result before this was opened.' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" "$license")" >/dev/null; then
              opened+=("$slug")
            else
              failed+=("$slug (pull request)")
            fi
            rm -rf "$tmp"
          done < "$RUNNER_TEMP/gems.tsv"

          {
            echo "## Converge Ruby gems"
            echo
            echo "| Outcome | Count | Repos |"
            echo "|---|---|---|"
            echo "| pull request opened | ${#opened[@]} | ${opened[*]-} |"
            echo "| pull request updated | ${#updated[@]} | ${updated[*]-} |"
            echo "| already converged | ${#unchanged[@]} | ${unchanged[*]-} |"
            echo "| converged, not opened | ${#converged[@]} | ${converged[*]-} |"
            echo "| no licence | ${#unlicensed[@]} | ${unlicensed[*]-} |"
            echo "| not ready for kettle-jem | ${#not_ready[@]} | ${not_ready[*]-} |"
            echo "| failed | ${#failed[@]} | ${failed[*]-} |"
            echo
            if [ "$HAS_PAT" != "true" ]; then
              echo "> No \`KETTLE_JEM_TOKEN\` secret, so nothing was pushed. Add a PAT with"
              echo "> \`contents: write\` and \`pull_requests: write\` on these repos to open the"
              echo "> pull requests."
            fi
            if [ ${#unlicensed[@]} -gt 0 ]; then
              echo "> A repo with no SPDX licence is skipped rather than guessed: kettle-jem's default is MIT."
            fi
            if [ ${#not_ready[@]} -gt 0 ]; then
              echo "> \"Not ready\" is this repo's own shape, not a failure of the run: a"
              echo "> \`spec.files\` kettle-jem cannot merge (it takes an Array literal, a \`Dir[]\`"
              echo "> call, or no assignment at all), a gemspec with no \`required_ruby_version\`,"
              echo "> one that cannot be loaded outside its own bundle, or a gem that was already"
              echo "> failing to build. The run log names the reason for each."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail loudly on errors in our own work. A repo with no licence is
          # not our error.
          if [ ${#failed[@]} -gt 0 ]; then
            printf '%s\n' "${failed[@]}" > "$RUNNER_TEMP/failed.txt"
            echo "::error::gems that could not be converged: ${failed[*]}"
            exit 1
          fi
          # Green with nothing is the worst outcome: name the success states.
          # Findings do not count — a broken shared config would turn every
          # repo into one, and that must not read as a successful run.
          if [ $((${#opened[@]} + ${#updated[@]} + ${#unchanged[@]} + ${#converged[@]})) -eq 0 ]; then
            echo "::error::no gem was converged and none was already converged"
            exit 1
          fi

      - name: File an issue when the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[converge-ruby-gems] Run failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$(gh issue list -R "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq 'length')" = "0" ]; then
            gh issue create -R "${{ github.repository }}" --title "$title" \
              --body "$(printf 'The gem converge run failed — see %s\n\n```\n%s\n```' "$url" "$(cat "$RUNNER_TEMP/failed.txt" 2>/dev/null || echo 'see the run log')")"
          fi
