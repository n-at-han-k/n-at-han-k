# kettle-jem configuration for one of n-at-han-k's Ruby gems.
#
# converge-ruby-gems.yml seeds this to <repo>/.structuredmerge/kettle-jem.yml,
# substituting {{LICENSE}} with the repo's SPDX licence and {{MIN_RUBY}} with
# its gemspec's required_ruby_version.
#
# RULE: set every key EXPLICITLY. kettle-jem's config_sync phase merges the
# packaged template config into this file on every run, and any key we omit is
# re-seeded with the template author's own value — including licences, funding
# handles, social handles and a personal ORCID. Omission is not neutral.

# Deliberately empty, and required to be present. A non-empty emoji makes
# kettle-jem rewrite the README H1 to "<emoji> <gem> / <Namespace>", throwing
# away the project's handwritten title.
project_emoji: ""

# No alias table. Omitted, this is seeded with the template author's own
# identities (pboling/galtzo/Aboling0 -> named individuals).
author_aliases: {}

# MRI only. Nothing here is tested on JRuby or TruffleRuby, so their
# workflows and badges are pruned rather than added and left failing.
engines:
  - ruby

ruby:
  test_minimum: "{{MIN_RUBY}}"

rubygems:
  min_ruby: ">= {{MIN_RUBY}}"
  # Never inject `require "version_gem"` into an entrypoint: these gems
  # declare their own version constant and several are C extensions.
  version_gem_entrypoint: disabled

gemspec:
  package_files:
    include:
      - data/**/*

# MUST be explicit. Omitted, config_sync injects `licenses: [MIT]` and the next
# run rewrites the gemspec to MIT and writes MIT.md into a repo licensed
# otherwise — Apache-2.0 and LGPL-2.1 are both in use here.
licenses:
  - "{{LICENSE}}"

funding:
  open_collective: false

repository:
  topology: standalone

rubyforum:
  family_tag: ""
  project_tag: ""

workflows:
  exec_cmd: rake
  recording: false

readme:
  top_logos: org
  h2_synopsis_logos: ""
  badges:
    fossa: false

license_eye:
  dependency_licenses: []

machine_users:
  - github-actions[bot]

min_divergence_threshold: ""

templates:
  root: packaged
  apply: true
  profile: full

# Semantic diff drivers need smorg-rb on PATH, which needs Ruby 4; these
# projects pin older Rubies in their own dev shells.
git_drivers: none

# No plugins. Omitted, this is seeded with `kettle-drift`.
plugins: []

defaults:
  preference: template
  add_template_only_nodes: true
  freeze_token: kettle-jem

# Every token the template fills with its author's own handles. Each must be
# present, or config_sync re-seeds the author's value.
tokens:
  forge:
    gh_user: "n-at-han-k"
    gl_user: ""
    cb_user: ""
    sh_user: ""
  author:
    name: "Nathan K"
    given_names: "Nathan"
    family_names: "K"
    email: "nathanblenheimkidd@gmail.com"
    domain: "github.com"
    orcid: ""
  funding:
    open_collective: false
    kofi: ""
    paypal: ""
    buymeacoffee: ""
    liberapay: ""
  social:
    mastodon: ""
    bluesky: ""
    linktree: ""
    devto: ""

patterns:
  # The packaged template raw_copies the template author's own public signing
  # certificate (certs/pboling.pem) into every project. Inert — it is not in
  # spec.files and cert_chain is empty — but it must not land in 40 repos.
  - path: "certs/**"
    strategy: keep_destination
  # The kettle-dev harness gemfiles pull dev-only third-party forks
  # (pboling/rspec_junit_formatter, pboling/rubocop-packaging).
  - path: "gemfiles/**"
    strategy: keep_destination
  # Generated kettle-dev CI assumes spec/ + rspec + appraisals + kettle-test.
  # These repos have their own suites — async-matrix alone has eleven
  # workflows driving two homeservers — and replacing them silently turns a
  # green repo red. Adopt the generated CI per repo, deliberately.
  # Both globs: `**` did not stop gem-push.yml being created, and the script
  # removes any workflow change after the fact regardless.
  - path: ".github/workflows/*"
    strategy: keep_destination
  - path: ".github/workflows/**"
    strategy: keep_destination

files:
  # Template boilerplate carrying the template author's own project links.
  FUNDING.md:
    strategy: keep_destination
  CONTRIBUTING.md:
    strategy: keep_destination
  # The agent instruction file is the house rules for the repo it sits in —
  # 262 lines of mise/kettle-test instructions appended to it is wrong wherever
  # the project does not use them.
  AGENTS.md:
    strategy: keep_destination
  # Offers "contact us to discuss a custom commercial license", and links
  # licence texts kettle-jem does not ship for every SPDX id in use here.
  LICENSE.md:
    strategy: keep_destination
  # Handwritten, and the one thing a reader sees first.
  README.md:
    strategy: keep_destination
  CHANGELOG.md:
    strategy: keep_destination
  # Wants personal given/family names per author; several of these have none.
  CITATION.cff:
    strategy: keep_destination
  # House Ruby style is deliberate and sometimes carries custom cops.
  .rubocop.yml:
    strategy: keep_destination
  # There is no Nix merger in the *-merge family, and these flakes carry
  # project-specific native dependencies.
  flake.nix:
    strategy: keep_destination
  # Upstream licence text where one is vendored verbatim.
  COPYING:
    strategy: keep_destination
